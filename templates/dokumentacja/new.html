{% extends "base.html" %}
{% block title %}Nowa teczka dokumentacji{% endblock %}

{% block head %}
<style>
@media (max-width: 640px) {
  .form-control, textarea.form-control { font-size: 16px; } /* bez zoom na iOS */
}
</style>
{% endblock %}

{% block content %}
<div class="page-header" style="margin-bottom:20px;">
  <a href="{{ url_for('dokumentacja.list_entries') }}" class="btn btn-outline btn-sm" style="margin-bottom:8px;">
    <i class="bi bi-arrow-left"></i> Powrót
  </a>
  <h1 class="page-title" style="font-size:1.3rem;margin:0;">
    <i class="bi bi-folder-plus" style="color:var(--accent,#1a6e8a);margin-right:6px;"></i>
    Nowa teczka dokumentacji
  </h1>
</div>

<div class="card" style="max-width:720px;">
  <div class="card-body">
    <form method="post">
      {{ csrf_input() }}
      <div class="form-group" style="margin-bottom:14px;">
        <label class="form-label">Tytuł <span style="color:#c0392b;">*</span></label>
        <input type="text" name="title" class="form-control" required maxlength="256"
               value="{{ form.get('title', '') }}"
               placeholder="np. Dokumentacja techniczna szafy PSH-1200"
               style="font-size:16px;" autofocus>
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label class="form-label">Opis <span class="text-muted">(opcjonalnie)</span></label>
        <textarea name="description" class="form-control" rows="4"
                  placeholder="Krótki opis zawartości teczki…"
                  style="font-size:16px;">{{ form.get('description', '') }}</textarea>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap;">
        <a href="{{ url_for('dokumentacja.list_entries') }}" class="btn btn-outline" style="flex:1;text-align:center;min-width:100px;">Anuluj</a>
        <button type="submit" class="btn btn-primary" style="flex:2;min-width:160px;">
          <i class="bi bi-check-lg"></i> Utwórz i dodaj pliki
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

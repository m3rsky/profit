{# Zakładki modułu Kontrola produkcji #}
{% set ep = request.endpoint or '' %}
<nav class="kp-tabs" aria-label="Kontrola produkcji">
  <a href="{{ url_for('kp.list_orders') }}"
     class="{% if ep in ('kp.list_orders', 'kp.order_detail', 'kp.scan_page') %}active{% endif %}">
    <i class="bi bi-diagram-2"></i> Zlecenia</a>
  <a href="{{ url_for('kp.buffers') }}"
     class="{% if ep in ('kp.buffers', 'kp.buffer_detail') %}active{% endif %}">
    <i class="bi bi-boxes"></i> Bufory</a>
  {% if current_user.can_enter_stock %}
  <a href="{{ url_for('kp.station') }}"
     class="{% if ep == 'kp.station' %}active{% endif %}">
    <i class="bi bi-upc-scan"></i> Stanowisko (wpis na bufor)</a>
  {% endif %}
</nav>
<style>
.kp-tabs { display:flex; gap:.4rem; margin:0 0 1rem; overflow-x:auto; padding-bottom:.35rem; }
.kp-tabs a { display:inline-flex; align-items:center; gap:.4rem; padding:.5rem .9rem; border-radius:999px; white-space:nowrap;
  border:1px solid var(--border,#e2e8f0); color:inherit; text-decoration:none; font-size:.9rem; flex:0 0 auto; }
.kp-tabs a.active { background:var(--blue-bg,#eff6ff); border-color:var(--progress-blue,#2563eb); color:var(--progress-blue,#2563eb); font-weight:600; }
</style>
